[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "polyglot-rpg"
version = "0.1.0"
authors = [
  { name="nrm", email="rbetra@gmail.com" },
]
description = "Инструмент для полуавтоматического перевода TTRPG материалов с помощью LLM."
readme = "README.md"
# --- ИЗМЕНЕНИЕ 1: Обновлен минимальный Python на 3.9+ ---
# Необходимо для использования синтаксиса type hints: list[str], dict[str, Any] и т.д.
requires-python = ">=3.9"
# --- ИЗМЕНЕНИЕ 2: Исправлен формат лицензии для PEP 621 ---
# license должна быть объектом с 'text' или 'file', а не простой строкой
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3",
    # "License :: OSI Approved :: MIT License", # <-- Эту строку можно убрать, она больше не нужна
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Topic :: Text Processing",
]

dependencies = [
    "typer",
    "openai",
    "markdown-it-py",
    "markdownify",
    "pyyaml",
    "tqdm",
    "tiktoken",
]

[project.urls]
"Homepage" = "https://github.com/nrm/polyglot-rpg"
"Bug Tracker" = "https://github.com/nrm/polyglot-rpg/issues"

[project.scripts]
polyglot-rpg = "polyglot_rpg.main:app"

# --- ИЗМЕНЕНИЕ 3: Явное указание пакетов ---
# Эта секция говорит setuptools: "Не ищи пакеты автоматически,
# а возьми только тот, что я указал в списке".
[tool.setuptools]
packages = ["polyglot_rpg"]